<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b10;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        color: #f4f4f5;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
      }
      #glow {
        position: absolute;
        width: 1400px;
        height: 1400px;
        left: 260px;
        top: -160px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(217, 119, 87, 0.35) 0%, rgba(217, 119, 87, 0) 60%);
      }
      .kicker {
        font-size: 36px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #d97757;
      }
      .headline {
        font-size: 140px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .sub {
        font-size: 44px;
        color: #a1a1aa;
      }
      .features {
        display: flex;
        flex-direction: column;
        gap: 36px;
      }
      .feature {
        display: flex;
        align-items: center;
        gap: 36px;
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #d97757;
      }
      .accent {
        color: #d97757;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1920"
      data-height="1080"
    >
      <div id="glow" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>

      <div id="intro" class="scene clip" data-start="0" data-duration="3.4" data-track-index="1">
        <div class="kicker">Introducing</div>
        <div class="headline">Claude Code <span class="accent">in the Cloud</span></div>
        <div class="sub">Your coding agent, running anywhere.</div>
      </div>

      <div id="list" class="scene clip" data-start="3.4" data-duration="3.9" data-track-index="2">
        <div class="features">
          <div class="feature"><span class="dot"></span>Writes &amp; runs code</div>
          <div class="feature"><span class="dot"></span>Pushes to GitHub</div>
          <div class="feature"><span class="dot"></span>Fixes failing CI</div>
          <div class="feature"><span class="dot"></span>Even renders video</div>
        </div>
      </div>

      <div id="outro" class="scene clip" data-start="7.3" data-duration="2.7" data-track-index="3">
        <div class="headline">Write HTML.</div>
        <div class="headline accent">Render video.</div>
        <div class="sub">Made with HyperFrames</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Background glow drifts slowly the whole time
      tl.fromTo("#glow", { x: -200, scale: 0.9 }, { x: 200, scale: 1.1, duration: 10, ease: "none" }, 0);

      // Scene 1: intro
      tl.fromTo("#intro .kicker", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#intro .headline", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out" }, 0.4);
      tl.fromTo("#intro .sub", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.0);
      tl.to("#intro", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 3.0);

      // Scene 2: feature list, staggered in
      tl.fromTo("#list .feature", { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.5, stagger: 0.45, ease: "power3.out" }, 3.5);
      tl.to("#list", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 6.9);

      // Scene 3: outro
      tl.fromTo("#outro .headline", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, stagger: 0.3, ease: "power3.out" }, 7.4);
      tl.fromTo("#outro .sub", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 8.4);
      tl.to("#outro", { opacity: 0, duration: 0.4 }, 9.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
